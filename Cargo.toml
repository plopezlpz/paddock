[package]
name = "paddock"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fast tmux popup for your sessions, windows and panes, and the AI coding agents running in them"
license = "MIT"
repository = "https://github.com/plopezlpz/paddock"
readme = "README.md"
keywords = ["tmux", "tui", "ai", "agents", "terminal"]
categories = ["command-line-utilities"]
exclude = ["docs/screenshots/*"]

[dependencies]
ansi-to-tui = "8.0.1"
nucleo-matcher = "0.3.1"
libc = "0.2.190"
ratatui = "0.30.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
