# Theme variant: the author's own tmux theme (gruber-darker, from their custom.conf
# and tmux.conf), made deterministic: the clock, the date and the host are literals.
# Same sessions and paddock options as ../tmux.conf. Hex colours pass through to the
# capture (RGB below); the agent colours are the ones the author sets for
# agent-status.tmux and paddock. The accent is paddock's own fallback, the active
# pane border's colour.
set -g default-terminal tmux-256color
set -sa terminal-features ',*:RGB'
set -g escape-time 10
set -g base-index 1
set -g renumber-windows on
set -g mouse on
set -g focus-events on
set -g status-position bottom

# selection highlight (copy mode), command and message
set -wg mode-style "bg=#453d41,fg=#f4f4ff"
set -g message-style "fg=#FEFEFE,bg=#303030"
set -g message-command-style "fg=#FEFEFE,bg=#303030"
set -g message-format "#[fill=#303030]#[#{?#{command_prompt},#{E:message-command-style},#{E:message-style}}]#{message}"
# pane borders
set -g pane-border-style "fg=#303030"
set -g pane-active-border-style "fg=#A2A970"
# status bar
set -g status on
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-style "bg=#202020,fg=#FEFEFE"
# Narrow clients (a phone, ~45 columns): no date/time/host, the session name without
# brackets and cut to 10, other windows as marker and index only. Below 110 (medium):
# the time without the date and host. Formats expand per client.
set -g @status-narrow '#{e|<:#{client_width},80}'
set -g @status-medium '#{e|<:#{client_width},110}'
# window status
setw -g window-status-style "fg=#8B9698,bg=#202020"
setw -g window-status-activity-style "none"
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#8B9698,bg=#202020] #{?@agent-icon,#{@agent-icon} ,}#I#{?#{E:@status-narrow},,:#W} "
setw -g window-status-current-format "#[fg=#F5F5F5,bg=#484848] #{?@agent-icon,#{@agent-icon} ,}#I:#{?#{E:@status-narrow},#{=/12/…:window_name},#W} #{?window_zoomed_flag,#{?#{E:@status-narrow},Z,[Z]} ,}"
# status-left
set -g status-left "#[fg=#202020,bg=#A2A970,bold] #{?#{E:@status-narrow},#{=/10/…:session_name},[#S]} #[fg=#202020,bg=#202020] "
# status-right: a fixed date, time and host
set -g status-right "#{?#{E:@status-narrow},,#{?#{E:@status-medium},#[fg=#FEFEFE#,bg=#34383C] 09:41 ,#[fg=#FEFEFE#,bg=#34383C] 2026-10-14 #[fg=#676767]│#[fg=#FEFEFE] 09:41 #[fg=#202020#,bg=#AA9AAC#,bold] devbox }}"

# agent-status.tmux's icons and the author's gruber-darker state colours
set -g @agent-icon-working '●'
set -g @agent-icon-asking '●'
set -g @agent-icon-finished '●'
set -g @agent-icon-idle '○'
set -g @agent-color-asking   '#cc4048'
set -g @agent-color-working  '#cc8c3c'
set -g @agent-color-finished '#96a6c8'
set -g @agent-color-idle     '#95a99f'

set -g @paddock-key a
set -g @paddock-click on
set -g @paddock-popup-style 'bg=#181818,fg=terminal'
set -g @paddock-popup-width  '#{?#{e|<:#{client_width},80},100%,80%}'
set -g @paddock-popup-height '#{?#{e|<:#{client_width},80},100%,80%}'
