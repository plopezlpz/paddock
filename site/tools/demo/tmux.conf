# The inner demo server: documented tmux and paddock options only, so the
# frames show what a plain config gets. The accent comes from
# pane-active-border-style, paddock's own fallback (see "Theme" in its README).
# The popup size follows the client width: the whole screen on a phone.
set -g default-terminal tmux-256color
set -g escape-time 10
set -g base-index 1
set -g renumber-windows on
set -g mouse on
set -g focus-events on
set -g status-position bottom
set -g status-style 'bg=default,fg=default'
set -g status-left '#[reverse,bold,fg=green] #S #[default] '
set -g status-left-length 24
set -g window-status-separator ''
set -g window-status-format ' #I #W#{?@agent-icon, #{@agent-icon},} '
set -g window-status-current-format '#[bold,underscore] #I #W#[nounderscore]#{?@agent-icon, #{@agent-icon},} #[default]'
set -g status-right '#[dim]09:41 '
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=green'
set -g @agent-icon-working '●'
set -g @agent-icon-asking '●'
set -g @agent-icon-finished '●'
set -g @agent-icon-idle '○'
set -g @agent-color-working yellow
set -g @agent-color-asking red
set -g @agent-color-finished cyan
set -g @agent-color-idle green
set -g @paddock-key a
set -g @paddock-click on
set -g @paddock-popup-width  '#{?#{e|<:#{client_width},80},100%,80%}'
set -g @paddock-popup-height '#{?#{e|<:#{client_width},80},100%,80%}'
