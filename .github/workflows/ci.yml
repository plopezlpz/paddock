name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # No `cargo fmt --check`: the code is not rustfmt-formatted.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      # The tmux entrypoint needs tmux 3.8+: Homebrew has it, Ubuntu's apt does not.
      - name: Plugin
        if: runner.os == 'macOS'
        run: brew install tmux && bash tests/paddock-tmux.sh
