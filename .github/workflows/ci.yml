name: CI

on:
  # Branches only: a release tag runs this workflow from release.yml, which waits for it.
  push:
    branches: ['**']
    paths-ignore: ['site/**']
  pull_request:
    paths-ignore: ['site/**']
  workflow_call:

permissions:
  contents: read

env:
  TMUX_VERSION: "3.8"
  TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # No `cargo fmt --check`: the code is not rustfmt-formatted.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      # paddock.tmux is compiled in (include_str!), so this keeps the crate publishable.
      - name: Package
        if: runner.os == 'Linux'
        run: cargo package --locked
      # paddock.tmux needs tmux 3.8, newer than the runners' packages: build it.
      - name: Install tmux build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libevent-dev libncurses-dev bison pkg-config
      - name: Install tmux build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libevent utf8proc jemalloc pkg-config bison
      - name: Build tmux
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo tmux.tar.gz "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  tmux.tar.gz" | shasum -a 256 -c
          tar xzf tmux.tar.gz
          cd "tmux-$TMUX_VERSION"
          # macOS needs explicit utf8proc and jemalloc choices: enable both, as
          # Homebrew's tmux does.
          if [ "$RUNNER_OS" = macOS ]; then mac="--enable-utf8proc --enable-jemalloc"; else mac=; fi
          # shellcheck disable=SC2086 # $mac is two flags or none
          ./configure --prefix="$HOME/.local" $mac
          make -j4
          make install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Plugin
        run: cargo build && tmux -V && bash tests/paddock-tmux.sh
      - name: Release scripts
        run: bash tests/release-scripts.sh
