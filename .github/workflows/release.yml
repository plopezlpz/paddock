name: Release

on:
  push:
    tags: ['v*']
  # A dry run: builds and uploads artifacts, never publishes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      master: ${{ steps.master.outputs.master }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Cargo.toml version matches the metadata and the tag
        id: v
        run: |
          v=$(awk -F'"' '/^\[/ { p = ($0 == "[package]") } p && /^version *=/ { print $2; exit }' Cargo.toml)
          m=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ -z "$v" ] || [ "$v" != "$m" ]; then
            echo "::error::Cargo.toml version '$v' does not match cargo metadata '$m'"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version v$v"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # Before anything is published: a release that master cannot be
      # fast-forwarded to would reach Homebrew but not TPM, which follows master.
      # A backport (a version older than master's, from a release branch) leaves
      # master alone; any other commit off master's line fails here. Pre-releases
      # never move master.
      - name: Master can be fast-forwarded to the tag
        id: master
        if: github.event_name == 'push' && github.ref_type == 'tag' && !contains(github.ref_name, '-')
        run: |
          m=$(bash scripts/advance-master.sh --check "$GITHUB_SHA")
          echo "master=$m" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      V: ${{ needs.check.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target "$TARGET"
      - name: Package
        run: |
          mkdir stage dist
          cp "target/$TARGET/release/paddock" LICENSE stage/
          tar -czf "dist/paddock-$TARGET.tar.gz" -C stage paddock LICENSE
          (cd dist && shasum -a 256 "paddock-$TARGET.tar.gz" > "paddock-$TARGET.tar.gz.sha256")
      # Every runner is native for its target, so run the binary.
      - name: Smoke check
        run: |
          got=$(stage/paddock --version)
          if [ "$got" != "paddock $V" ]; then
            echo "::error::stage/paddock reports '$got', expected 'paddock $V'"
            exit 1
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            file stage/paddock
            file stage/paddock | grep -Eq 'statically linked|static-pie linked'
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: paddock-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The full test suite (ci.yml) for the tagged commit: nothing is published unless it passes.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: [build, ci]
    # A dispatch never publishes, even on a tag.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: The tag still names this commit
        run: |
          [ "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$GITHUB_SHA" ] ||
            { echo "::error::$TAG no longer points at $GITHUB_SHA; push a new tag instead of moving one"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: paddock-*
          merge-multiple: true
      - name: Publish
        run: |
          ls -l dist
          n=$(find dist -type f | wc -l)
          if [ "$n" -ne 8 ]; then
            echo "::error::expected 8 files in dist, found $n"
            exit 1
          fi
          # Published releases are immutable: never touch their assets.
          published=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == env.TAG and (.draft | not)) | .id')
          if [ -n "$published" ]; then
            have=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == env.TAG and (.draft | not)) | .assets[].name')
            for f in dist/*; do
              if ! printf '%s\n' "$have" | grep -qxF "$(basename "$f")"; then
                echo "::error::$TAG is published without $(basename "$f"); cut a new version"
                exit 1
              fi
            done
            echo "$TAG is already published with all 8 assets"
            exit 0
          fi
          # Leftover drafts are from interrupted runs: start over. By id, since
          # a tag can name several drafts and gh resolves it to only one.
          draft_ids() { gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == env.TAG and .draft) | .id'; }
          for id in $(draft_ids); do
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
          done
          # A pre-release (vX.Y.Z-rc1) is marked as one and never becomes "Latest";
          # otherwise GitHub picks Latest by version, so a backport doesn't take it.
          pre='' latest=legacy
          case "$TAG" in *-*) pre=1 latest=false ;; esac
          gh release create "$TAG" --draft ${pre:+--prerelease} --verify-tag --title "paddock ${TAG#v}" --generate-notes dist/*
          ids=$(draft_ids)
          if [ "$(printf '%s\n' "$ids" | grep -c .)" -ne 1 ]; then
            echo "::error::expected exactly one draft for $TAG, found: $ids"
            exit 1
          fi
          gh api -X PATCH "repos/$GH_REPO/releases/$ids" -F draft=false -f make_latest="$latest"

  # After the release is published: put its checksums into the Homebrew tap.
  # update-tap.sh leaves the tap alone for a pre-release, and for a version older
  # than the tap's; it fails if the HOMEBREW_TAP_DEPLOY_KEY secret is missing.
  tap:
    needs: release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - name: Update the Homebrew tap
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: bash scripts/update-tap.sh "$TAG"

  # Last: move master to the released commit (fast-forward only), so TPM, which
  # follows master, only ever sees a version whose release exists. Runs even if
  # the tap update failed: the release itself is out. Never for a pre-release:
  # TPM users would be moved onto it; nor for a backport (check said so). The
  # workflow token cannot push commits that change .github/workflows, so those
  # must reach master before the tag (RELEASING.md).
  # Its push starts no workflows either, so Pages is started by hand.
  master:
    needs: [check, release, tap]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.check.outputs.master == 'advance' && github.event_name == 'push' && github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: The tag still names this commit
        run: |
          [ "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$GITHUB_SHA" ] ||
            { echo "::error::$TAG no longer points at $GITHUB_SHA; push a new tag instead of moving one"; exit 1; }
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # check looked before publishing, but master may have moved since: the
      # script looks again, and pushes without --force.
      - name: Fast-forward master to the release
        run: bash scripts/advance-master.sh "$GITHUB_SHA"
      - name: Redeploy the site
        run: gh workflow run pages.yml --ref master
